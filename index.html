<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>던전 디펜스 - 기지를 지켜라!</title>
<link rel="stylesheet" href="style.css?v=20260807e">
</head>
<body>

<div id="app">

  <!-- ===================== 로비 ===================== -->
  <section id="screen-lobby" class="screen active">
    <div class="lobby-bg">
      <div class="lobby-torch left"></div>
      <div class="lobby-torch right"></div>
    </div>
    <div class="lobby-title">
      <h1>던전 디펜스</h1>
      <p class="subtitle">기지를 지켜라!</p>
    </div>
    <div class="lobby-currency">
      <div class="cur-pill gold"><span class="cur-icon"></span><span id="lobby-gold">0</span></div>
      <div class="cur-pill gem"><span class="cur-icon"></span><span id="lobby-gem">0</span></div>
    </div>
    <button class="checkin-badge" id="btn-checkin">
      <span class="flame-icon"></span>
      <span id="checkin-badge-num">0</span>
      <span class="checkin-ping" id="checkin-ping" style="display:none;"></span>
    </button>
    <button class="quest-badge" id="btn-quest">
      <span class="scroll-icon"></span>
      <span id="quest-badge-num">0/4</span>
      <span class="checkin-ping" id="quest-ping" style="display:none;"></span>
    </button>
    <div class="lobby-buttons">
      <button class="lobby-btn start-btn" id="btn-start">
        <span class="btn-shine"></span>
        <span class="btn-label">시작</span>
      </button>
      <button class="lobby-btn equip-btn" data-nav="equip">
        <span class="btn-label">장비</span>
      </button>
      <button class="lobby-btn shop-btn" data-nav="shop">
        <span class="btn-label">상점</span>
      </button>
      <button class="lobby-btn achievement-btn" id="btn-achievements">
        <span class="btn-label">업적</span>
        <span class="achv-count" id="achv-count">0/0</span>
      </button>
    </div>
  </section>

  <!-- ===================== 캐릭터 직접 그리기 ===================== -->
  <section id="screen-draw" class="screen">
    <div class="draw-header">
      <h2>그리세요!</h2>
      <p>당신이 그린 그림이 캐릭터가 됩니다</p>
    </div>
    <div class="draw-canvas-wrap">
      <canvas id="drawCanvas" width="320" height="320"></canvas>
    </div>
    <div class="draw-toolbar">
      <div class="draw-colors" id="draw-colors"></div>
      <div class="draw-sizes" id="draw-sizes">
        <button class="brush-size-btn" data-size="3"><span style="width:5px;height:5px;"></span></button>
        <button class="brush-size-btn active" data-size="6"><span style="width:9px;height:9px;"></span></button>
        <button class="brush-size-btn" data-size="12"><span style="width:14px;height:14px;"></span></button>
      </div>
      <button class="draw-clear-btn" id="draw-clear">지우기</button>
    </div>
    <div class="draw-actions">
      <button class="draw-skip-btn" id="draw-skip">나중에 할게요</button>
      <button class="draw-done-btn" id="draw-done">완료!</button>
    </div>
  </section>

  <!-- ===================== 유형 선택 (던전/보스/챌린지) ===================== -->
  <section id="screen-type-select" class="screen">
    <header class="sub-header">
      <button class="back-btn" data-nav="lobby">◀</button>
      <h2>모험 선택</h2>
    </header>
    <div class="scroll-list vertical" id="type-list"></div>
  </section>

  <!-- ===================== 던전 목록 ===================== -->
  <section id="screen-dungeon-list" class="screen">
    <header class="sub-header">
      <button class="back-btn" data-nav="type-select">◀</button>
      <h2>던전</h2>
    </header>
    <div class="scroll-list vertical" id="dungeon-list"></div>
  </section>

  <!-- ===================== 보스 목록 ===================== -->
  <section id="screen-boss-list" class="screen">
    <header class="sub-header">
      <button class="back-btn" data-nav="type-select">◀</button>
      <h2>보스 토벌</h2>
    </header>
    <div class="scroll-list vertical" id="boss-list"></div>
  </section>

  <!-- ===================== 챌린지 목록 ===================== -->
  <section id="screen-challenge-list" class="screen">
    <header class="sub-header">
      <button class="back-btn" data-nav="type-select">◀</button>
      <h2>챌린지</h2>
    </header>
    <div class="scroll-list vertical hell" id="challenge-list"></div>
  </section>

  <!-- ===================== 게임 플레이 ===================== -->
  <section id="screen-game" class="screen">
    <div class="game-topbar">
      <button class="ingame-back" id="btn-quit">◀</button>
      <div class="wave-badge"><span id="wave-label">WAVE 1</span></div>
      <div class="boss-hp-wrap" id="boss-hp-wrap" style="display:none;">
        <div class="boss-name" id="boss-name">보스</div>
        <div class="boss-hp-bar"><div class="boss-hp-fill" id="boss-hp-fill"></div></div>
      </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div class="base-hp-wrap">
      <div class="base-hp-bar"><div class="base-hp-fill" id="base-hp-fill"></div></div>
    </div>

    <div class="controls">
      <div class="move-zone-wrap">
        <div class="joystick move" id="move-stick">
          <div class="stick-base"></div>
          <div class="stick-knob"></div>
        </div>
        <span class="pc-hint">WASD 이동</span>
      </div>
      <div class="attack-controls">
        <div class="ammo-bar-wrap">
          <div class="ammo-bar" id="ammo-bar"></div>
        </div>
        <div class="stick-row">
          <div class="joystick special" id="special-stick">
            <div class="stick-base"></div>
            <div class="stick-knob"></div>
          </div>
          <div class="joystick main" id="main-stick">
            <div class="stick-base"></div>
            <div class="stick-knob"></div>
          </div>
        </div>
        <span class="pc-hint">마우스 조준 · 클릭 발사</span>
      </div>
    </div>

    <div class="overlay" id="overlay-message" style="display:none;">
      <div class="overlay-box">
        <h2 id="overlay-title"></h2>
        <p id="overlay-desc"></p>
        <div class="overlay-rewards" id="overlay-rewards"></div>
        <div class="overlay-btns">
          <button id="overlay-retry">다시하기</button>
          <button id="overlay-lobby">로비로</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== 장비 ===================== -->
  <section id="screen-equip" class="screen">
    <header class="sub-header">
      <button class="back-btn" data-nav="lobby">◀</button>
      <h2>장비</h2>
    </header>
    <div class="player-preview">
      <canvas id="playerPreviewCanvas"></canvas>
      <button class="redraw-btn" id="btn-redraw">다시 그리기</button>
    </div>
    <div class="equip-body">
      <div class="equip-cats" id="equip-cats"></div>
      <div class="equip-list" id="equip-list"></div>
    </div>
  </section>

  <!-- ===================== 업그레이드 화면 ===================== -->
  <section id="screen-upgrade" class="screen">
    <header class="sub-header">
      <button class="back-btn" data-nav="equip">◀</button>
      <h2 id="upgrade-item-name">업그레이드</h2>
    </header>
    <div class="player-preview small">
      <canvas id="upgradePreviewCanvas"></canvas>
    </div>
    <div class="upgrade-body" id="upgrade-body-normal">
      <div class="upgrade-item-card">
        <canvas id="upgradeItemCanvas" width="280" height="280"></canvas>
        <div class="upgrade-stats">
          <div class="ustat"><span>레벨</span><b id="up-level">1</b></div>
          <div class="ustat"><span id="up-damage-label">데미지</span><b id="up-damage">0</b></div>
          <div class="ustat"><span>범위</span><b id="up-range">0</b></div>
        </div>
      </div>
      <p class="upgrade-desc" id="upgrade-desc"></p>
      <button class="awaken-btn" id="btn-awaken" style="display:none;">✦ 각성하기 ✦</button>
      <div class="upgrade-footer">
        <div class="upgrade-preview-change" id="upgrade-change"></div>
        <div class="upgrade-cost" id="upgrade-cost"></div>
        <button class="upgrade-confirm" id="btn-upgrade-confirm">업그레이드</button>
      </div>
    </div>
    <div class="awaken-grid-wrap" id="awaken-grid-wrap" style="display:none;">
      <div class="awaken-info" id="awaken-info"></div>
      <div class="hex-grid" id="hex-grid"></div>
      <button class="awaken-back" id="btn-awaken-back">돌아가기</button>
    </div>
  </section>

  <!-- ===================== 상점 ===================== -->
  <section id="screen-shop" class="screen">
    <header class="sub-header">
      <button class="back-btn" data-nav="lobby">◀</button>
      <h2>상점</h2>
      <div class="shop-currency">
        <div class="cur-pill gold small"><span class="cur-icon"></span><span id="shop-gold">0</span></div>
        <div class="cur-pill gem small"><span class="cur-icon"></span><span id="shop-gem">0</span></div>
      </div>
    </header>
    <div class="scroll-list horizontal" id="merchant-row"></div>
  </section>

  <!-- 상인 물건 모달 -->
  <div id="merchant-modal" class="modal" style="display:none;">
    <div class="modal-card">
      <div class="modal-head" id="merchant-modal-head"></div>
      <div class="modal-list" id="merchant-modal-list"></div>
      <button class="modal-close" id="merchant-modal-close">닫기</button>
    </div>
  </div>

  <!-- ===================== 가챠 ===================== -->
  <section id="screen-gacha" class="screen">
    <header class="sub-header">
      <button class="back-btn" data-nav="shop">◀</button>
      <h2>아이템 뽑기</h2>
      <div class="shop-currency">
        <div class="cur-pill gem small"><span class="cur-icon"></span><span id="gacha-gem">0</span></div>
      </div>
    </header>
    <div class="gacha-row" id="gacha-row"></div>
  </section>

  <!-- 가챠 결과 모달 -->
  <div id="gacha-result-modal" class="modal" style="display:none;">
    <div class="modal-card gacha-result">
      <div id="gacha-result-item"></div>
      <button class="modal-close" id="gacha-result-close">확인</button>
    </div>
  </div>

  <!-- ===================== 일일 출석 체크 ===================== -->
  <div id="checkin-modal" class="modal" style="display:none;">
    <div class="modal-card checkin-card">
      <div class="modal-head">일일 출석 체크</div>
      <p class="checkin-sub">연속 출석 <b id="checkin-streak-label">0</b>일째</p>
      <div class="checkin-grid" id="checkin-grid"></div>
      <button class="checkin-claim-btn" id="checkin-claim-btn">오늘 출석하기</button>
      <button class="modal-close" id="checkin-modal-close">닫기</button>
    </div>
  </div>

  <!-- ===================== 일일 퀘스트 ===================== -->
  <div id="quest-modal" class="modal" style="display:none;">
    <div class="modal-card quest-card">
      <div class="modal-head">일일 퀘스트</div>
      <p class="quest-sub">매일 자정에 초기화됩니다</p>
      <div class="quest-list" id="quest-list"></div>
      <button class="modal-close" id="quest-modal-close">닫기</button>
    </div>
  </div>

  <!-- ===================== 업적 ===================== -->
  <div id="achv-modal" class="modal" style="display:none;">
    <div class="modal-card quest-card">
      <div class="modal-head">업적</div>
      <p class="quest-sub">영구적으로 달성하는 목표입니다</p>
      <div class="quest-list" id="achv-list"></div>
      <button class="modal-close" id="achv-modal-close">닫기</button>
    </div>
  </div>

</div>

<script src="game.js?v=20260807e"></script>
</body>
</html>
